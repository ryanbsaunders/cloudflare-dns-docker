---
services:
  unbound:
    container_name: unbound
    image: ryansaunders/cloudflare-dns-docker
    ports:
      - 853:53/udp
    restart: unless-stopped
    networks:
      internaldns:
        ipv4_address: 192.168.2.2
    volumes:
      - './unbound.conf:/etc/unbound/unbound.conf:ro'
      - './var-log/unbound/:/var/log/unbound/'

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    shm_size: '512mb'
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_PORT:-80}:80/tcp"
    environment:
      - TZ=America/New_York
      - FTLCONF_webserver_api_password=${WEBPASSWORD}
      - FTLCONF_dns_upstreams=192.168.2.2
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_dns_rateLimit_count=0
      - FTLCONF_dns_queryLogging=true
      - FTLCONF_misc_extraLogging=true
    networks:
      internaldns:
        ipv4_address: 192.168.2.3
    dns:
    #  - 192.168.1.1
      - 127.0.0.1
    restart: unless-stopped
    volumes:
      - './etc-pihole/:/etc/pihole/'
      - './etc-dnsmasq.d/:/etc/dnsmasq.d/'
      - './var-log/:/var/log/'
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`${PIHOLE_HOST}`)
      - traefik.http.routers.pihole.tls=true
      - traefik.http.routers.pihole.tls.certresolver=certificato
      - traefik.http.services.pihole.loadbalancer.server.port=80

networks:
  internaldns:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.2.0/24
  proxy:
